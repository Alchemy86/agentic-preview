apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-preview
  namespace: agentic-preview
  labels:
    app: agentic-preview
spec:
  # EXACTLY ONE REPLICA, and Recreate rather than RollingUpdate.
  #
  # agentic-preview holds one traffic-manager client session and the tunnels that
  # serve it. Two replicas would each arrive as their own session and each try
  # to raise the same intercepts; the second would collide on identical header
  # filters rather than share the work. A rolling update would briefly do the
  # same, so the old pod is stopped before the new one starts. The cost is a
  # few seconds in which previews are down - see the "honest limits" section of
  # the README for what "down" means for a request carrying a preview header.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentic-preview
  template:
    metadata:
      labels:
        app: agentic-preview
    spec:
      serviceAccountName: agentic-preview
      # If your registry is private, add its pull secret here:
      #   imagePullSecrets:
      #     - name: your-registry-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentic-preview
          # PLACEHOLDER (3): your own registry and tag. The tag is overridden by
          # the `images:` block in kustomization.yaml.
          image: registry.example.com/agentic-preview:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # PLACEHOLDER (1): the traffic-manager's gRPC address. Required -
            # there is no default, because the namespace telepresence was
            # installed into varies and a wrong guess fails as a dial timeout.
            #   kubectl get deploy -A | grep traffic-manager
            - name: MANAGER_ADDR
              value: traffic-manager.telepresence.svc.cluster.local:8081
            - name: LISTEN_ADDR
              value: ":8080"
            # The single header every preview is routed on. Its VALUE is the
            # work id, which is what lets several PRs of one change be reached
            # together by one header. Service-level, not per-request, on
            # purpose: two services of one work id behind different header
            # names would defeat the point of a work id.
            - name: HEADER_NAME
              value: x-preview
            # PLACEHOLDER (2), and the boundary in BOTH directions: the
            # namespaces a preview may be intercepted in, and the namespaces it
            # may be forwarded to. The attachment Roles in rbac.yaml bound
            # interception only - forwarding is a plain net.Dial that no
            # Kubernetes permission is consulted for - so this list is the only
            # thing bounding the forward target. Required: there is no default,
            # because an empty list read as "everything" is the wrong failure.
            # Comma-separated. Keep it in step with the attach Roles.
            - name: ALLOWED_NAMESPACES
              value: shop
            # How long a preview lives without being touched, as a safety net
            # against forgotten previews accumulating. Anything that touches a
            # work id - raising a service under it again, adding another - puts
            # every preview in that id back to a full lifetime, and GET
            # /previews reports each deadline BEFORE it arrives so somebody can
            # extend it rather than discover it went.
            #
            # It is NOT a teardown policy. Teardown is explicit: a preview goes
            # when somebody DELETEs it. Nothing here removes a preview because
            # a pull request merged or closed - work carries on against a
            # preview after the merge, and this service has no notion of a pull
            # request in any case.
            #
            # 24h is the default because it is the safe answer when nobody is
            # minding the cluster. Set it to `off` (or `never`, or `0`) if
            # something else is responsible for cleaning previews up - a timer
            # that removes a preview while somebody is still testing against it
            # is worse than a forgotten pod. Switching it off is deliberately
            # an explicit choice: leave this alone and you get the timer.
            #
            # Either way GET /previews reports every preview's age, so
            # accumulating previews are visible with expiry off too.
            - name: PREVIEW_LIFETIME
              value: 24h
            # How long a create waits for the preview's pods to actually come
            # up before giving up and reporting why. The two loudest failures -
            # an image reference that does not resolve, and no credentials to
            # pull it - are invisible at create time and obvious ten seconds
            # later. Set to 0 to skip the wait.
            - name: PREVIEW_READY_TIMEOUT
              value: 120s
            # OPTIONAL - scheduled, HEADERLESS intercepts. Off unless both of
            # these and the volume below are uncommented and schedules.yaml is
            # added to kustomization.yaml's `resources`. Read that file first:
            # a scheduled intercept diverts ALL of a workload's traffic, not one
            # header's worth, and it cannot share a workload with a preview.
            # - name: SCHEDULE_FILE
            #   value: /etc/agentic-preview/schedules.yaml
            # Both how promptly a window opens or closes AND how quickly a
            # scheduled intercept that has died is noticed and re-raised. Short
            # because of the second: a dead global intercept holds every request
            # to the workload, and nobody is awake at 03:00 to notice.
            # - name: SCHEDULE_CHECK_INTERVAL
            #   value: 30s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            # Ready only once a manager session exists, so a caller is never
            # handed a pod that cannot raise anything.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/agentic-preview
            # OPTIONAL, with SCHEDULE_FILE above.
            # - name: schedules
            #   mountPath: /etc/agentic-preview
            #   readOnly: true
      volumes:
        # Records the current session id so a restarted container can depart its
        # predecessor's session and release what it held. An emptyDir survives a
        # container restart but not a pod replacement; a replacement falls back
        # to the conflict-driven sweep, which is the one that actually matters.
        - name: state
          emptyDir: {}
        # OPTIONAL, with SCHEDULE_FILE above. Read once at startup and never
        # reloaded: a window that opens at 18:32 has to have been proved
        # parseable at 09:00, not discovered to be unparseable at 18:32. Editing
        # the ConfigMap therefore needs a restart, which is also the moment the
        # schedule is re-validated.
        # - name: schedules
        #   configMap:
        #     name: agentic-preview-schedules
      # Long enough for Shutdown to remove every intercept and depart the
      # session before the container is killed. Removing them is what makes a
      # stop safe: an intercept left in manager state with nobody holding its
      # tunnel makes its own header hang.
      terminationGracePeriodSeconds: 60
