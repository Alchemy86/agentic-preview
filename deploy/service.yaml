apiVersion: v1
kind: Service
metadata:
  name: agentic-preview
  namespace: agentic-preview
  labels:
    app: agentic-preview
spec:
  # ClusterIP only. A pipeline inside the cluster calls this; it is deliberately
  # not exposed through an Ingress, because anything that can reach it can raise
  # an intercept on any workload in ALLOWED_NAMESPACES and point that intercept
  # at any Service in those same namespaces.
  type: ClusterIP
  selector:
    app: agentic-preview
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
