apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-preview.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-preview.labels" . | nindent 4 }}
spec:
  # EXACTLY ONE REPLICA, deliberately not a value, and Recreate rather than
  # RollingUpdate.
  #
  # agentic-preview holds one traffic-manager client session and the tunnels
  # that serve it. Two replicas would each arrive as their own session and each
  # try to raise the same intercepts; the second would collide on identical
  # header filters rather than share the work. That makes one replica a
  # correctness requirement, not a preference, so the chart does not offer to
  # get it wrong. A rolling update would briefly do the same, so the old pod is
  # stopped before the new one starts - the cost is a few seconds in which
  # previews are down.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agentic-preview.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic-preview.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations .Values.schedules }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.schedules }}
        # Rolls the pod when a schedule changes. The schedule file is read once
        # at startup and never reloaded - deliberately, so that a window opening
        # at 18:32 was proved parseable at 09:00 - which without this means an
        # edited ConfigMap silently does nothing until something else restarts
        # the pod. The restart is also when the new schedule is re-validated, so
        # a bad edit fails where somebody is looking.
        checksum/schedules: {{ include (print $.Template.BasePath "/schedules.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agentic-preview.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentic-preview
          image: {{ include "agentic-preview.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # The traffic-manager's gRPC address. Plain h2c; the manager
            # terminates no TLS on this port.
            - name: MANAGER_ADDR
              value: {{ include "agentic-preview.managerAddr" . | quote }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: HEADER_NAME
              value: {{ .Values.preview.headerName | quote }}
            # The boundary in BOTH directions - see the note on
            # allowedNamespaces in values.yaml. The attach and build Roles
            # bound interception and creation; nothing but this env var bounds
            # the forward target, which is why the chart generates all three
            # from the one list.
            - name: ALLOWED_NAMESPACES
              value: {{ include "agentic-preview.allowedNamespaces" . | fromYamlArray | join "," | quote }}
            - name: PREVIEW_LIFETIME
              value: {{ include "agentic-preview.previewLifetime" . | quote }}
            - name: PREVIEW_READY_TIMEOUT
              value: {{ .Values.preview.readyTimeout | quote }}
            {{- if .Values.schedules }}
            # Scheduled, HEADERLESS intercepts. Declared in config rather than
            # raised over the API because a global intercept takes every request
            # to a workload, not one header's worth, so it is a thing to review
            # in a repository and not a thing to be able to ask for over HTTP.
            - name: SCHEDULE_FILE
              value: /etc/agentic-preview/schedules.yaml
            # Both how promptly a window opens or closes AND how quickly a
            # scheduled intercept that has died is noticed - see the note in
            # values.yaml for why the second of those is the reason it is short.
            - name: SCHEDULE_CHECK_INTERVAL
              value: {{ .Values.scheduleCheckInterval | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            # Ready only once a manager session exists, so a caller is never
            # handed a pod that cannot raise anything.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/agentic-preview
            {{- if .Values.schedules }}
            - name: schedules
              mountPath: /etc/agentic-preview
              readOnly: true
            {{- end }}
      volumes:
        # Records the current session id so a restarted container can depart
        # its predecessor's session and release what it held. An emptyDir
        # survives a container restart but not a pod replacement; a replacement
        # falls back to the conflict-driven sweep, which is the one that
        # actually matters.
        - name: state
          emptyDir: {}
        {{- if .Values.schedules }}
        # Read once at startup and never reloaded: a window that opens at 18:32
        # has to have been proved parseable at 09:00, not discovered to be
        # unparseable at 18:32. Editing the ConfigMap therefore needs a restart,
        # which is also the moment the schedule is re-validated.
        - name: schedules
          configMap:
            name: {{ include "agentic-preview.fullname" . }}-schedules
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Long enough for shutdown to remove every intercept and depart the
      # session before the container is killed. Removing them is what makes a
      # stop safe: an intercept left in manager state with nobody holding its
      # tunnel makes its own header hang.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
