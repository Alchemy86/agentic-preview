apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-preview.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-preview.labels" . | nindent 4 }}
spec:
  # ClusterIP, and no Ingress anywhere in this chart. A pipeline inside the
  # cluster calls this; anything that can reach it can raise an intercept on
  # any workload in allowedNamespaces and point that intercept at any Service
  # in those same namespaces.
  type: {{ .Values.service.type }}
  selector:
    {{- include "agentic-preview.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
