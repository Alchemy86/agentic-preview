{{- if .Values.serviceAccount.create }}
# The identity agentic-preview presents to the traffic-manager. Its projected
# token is the only credential the service holds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentic-preview.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-preview.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
