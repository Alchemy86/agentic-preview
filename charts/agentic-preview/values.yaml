# agentic-preview - values.
#
# One value is required and has no default: allowedNamespaces. Everything else
# below is a default that works. See charts/example-values.yaml in the source
# repository for a filled-in file.

# REQUIRED. The namespaces agentic-preview may intercept in, build previews in,
# and forward to. There is no default and the chart refuses to render without
# it, because this list is the safety boundary in both directions and an empty
# list read as "every namespace" is the wrong failure.
#
# Each entry generates its own attach Role and build Role, with a RoleBinding
# each, in that namespace - never a ClusterRole - and the same set is passed to
# the service as ALLOWED_NAMESPACES, so the three ends of a preview cannot
# drift apart.
#
#   allowedNamespaces:
#     - shop
#     - warehouse
allowedNamespaces: []

trafficManager:
  # The namespace the Telepresence traffic-manager runs in. This is where the
  # ConnectReview Role and its RoleBinding are created, and - unless `address`
  # below is set - it is also what the manager's gRPC address is derived from.
  #
  #   kubectl get deploy -A | grep traffic-manager
  #
  # `telepresence` is Telepresence's own default install namespace, not an
  # assumption about your cluster. If yours is elsewhere, change it here.
  namespace: telepresence

  # Optional override for the manager's gRPC address, for an installation that
  # does not answer on the usual in-cluster name. Leave empty to derive
  #   traffic-manager.<trafficManager.namespace>.svc.cluster.local:8081
  # Setting this does NOT move the ConnectReview Role - that follows
  # `namespace` above, so set both if the manager is somewhere unusual.
  address: ""

image:
  repository: ghcr.io/alchemy86/agentic-preview
  # Empty means the chart's appVersion, which the release workflow stamps from
  # the same git tag that pushed the image. Leaving it empty is what guarantees
  # the chart and the image are the same release.
  #
  tag: ""
  # Pin the digest rather than a tag for anything you care about: a tag is a
  # pointer the registry owner can move, a digest is the bytes. When set, the
  # image is referenced by digest and `tag` is ignored.
  #   digest: "sha256:0123..."
  digest: ""
  pullPolicy: IfNotPresent
  # Only needed if you host the image somewhere private. The published package
  # is public and needs no login.
  #   pullSecrets:
  #     - name: your-registry-pull-secret
  pullSecrets: []

preview:
  # The single header every preview is routed on. Its VALUE is the work id,
  # which is what lets several services of one change be reached together.
  # Service-level, not per-request, on purpose.
  headerName: x-preview

  # How long a preview lives without being touched, as a safety net against
  # forgotten previews accumulating. Anything that touches a work id puts every
  # preview in that id back to a full lifetime.
  #
  # It is NOT a teardown policy - teardown is explicit, by DELETE. Set it to
  # `off` (or `never`, or `0`) when something else is responsible for cleaning
  # previews up, because a timer that removes a preview while somebody is still
  # testing against it is worse than a forgotten pod. Leaving it alone gives
  # you the timer, which is the safe answer when nobody is minding the cluster.
  lifetime: 24h

  # How long a create waits for the preview's pods to come up before giving up
  # and reporting why. The two loudest failures - an image reference that does
  # not resolve, and no credentials to pull it - are invisible at create time
  # and obvious ten seconds later. `0` skips the wait.
  readyTimeout: 120s

# Schedules: recurring windows. Empty - the default - means there are none and
# nothing about this mode is rendered or reached.
#
# There are two KINDS and every entry says which it is in `type:`. The name, the
# windows and the zone mean the same thing in both, and there is one
# implementation of them.
#
# `type: intercept` gives ONE workload a recurring window. While the window is open
# agentic-preview raises a GLOBAL intercept on it: no header filter at all, so
# every connection to that port is diverted to targetService, whatever it
# carries and whether it is TLS or plaintext. When the window closes the
# intercept is removed and the workload serves its own traffic again. Nothing
# has to call /previews for this; nothing has to be awake.
#
# Three things to know before declaring one, because they are not obvious:
#
#   * A WORKLOAD RUNS IN ONE INTERCEPT MODE AT A TIME. Telepresence's
#     traffic-agent switches the whole port to HTTP mode as soon as any
#     header-filtered intercept is live on it, and a headerless intercept then
#     matches nothing while still reporting itself healthy. agentic-preview
#     refuses both directions loudly rather than letting that happen - so do not
#     put a workload people raise previews against on a schedule.
#
#   * IT IS ALL OF THAT WORKLOAD'S TRAFFIC. A header-keyed preview affects one
#     header; this affects everything reaching the port. If agentic-preview dies
#     un-gracefully while a window is open, that traffic is held rather than
#     failing over until the replacement pod departs the dead session (seconds)
#     - see the limits page.
#
#   * ALLOWED NAMESPACES BOUND IT, in both directions, exactly as they bound a
#     preview. The chart refuses to render a schedule outside the list.
#
# `type: dns` gives ONE DNS NAME a recurring window instead, and exists because
# an intercept needs a workload: a dependency with no pod, Deployment or Service
# - a managed database behind Private Link, an appliance - has no interception
# point in the cluster except the resolver. While the window is open one tagged
# `hosts` line is written into scheduleDNSConfigMap below, and removed when it
# closes. It changes that name for the WHOLE cluster, not for one workload and
# not for one header.
#
#   schedules:
#     - name: offhours              # the id it is reported under; reserved as a work id
#       type: intercept             # required, and never inferred from the fields below
#       workload: checkout-api
#       namespace: shop
#       port: "8443"                # port identifier on the workload, default 80
#       # service: checkout-tls     # only when the workload has two Services on the port
#       targetService: auth-stub    # or auth-stub.previews
#       targetPort: 8443
#       windows:
#         # An overnight reads naturally as an end time; end <= start is the
#         # next day, so this is 18:32 through to 07:21.
#         - days: [Mon, Tue, Wed, Thu]
#           start: "18:32"
#           end:   "07:21"
#         # Anything longer than a day needs a duration instead: Friday evening
#         # straight through to Monday morning is one window, not three.
#         - days: [Fri]
#           start: "18:32"
#           duration: 60h49m
#
#     - name: db-offhours
#       type: dns
#       hostname: dev-db.example.internal   # the name overridden while the window is open
#       redirectTo: 10.42.0.9               # where it points, as a LITERAL IP - see below
#       windows:
#         - days: [Mon, Tue, Wed, Thu]
#           start: "18:32"
#           end:   "07:21"
schedules: []

# The ONE ConfigMap key a `type: dns` schedule writes its hosts line into. It is
# required as soon as one is declared, and there is NO DEFAULT on purpose.
#
# In a cluster this is kube-system/coredns-custom, key host.override - but
# defaulting to it would make "I declared a window" and "I edited the cluster's
# resolver" the same act. Naming it is the decision, and it is made here.
#
# redirectTo is a literal IP rather than a Service name for the matching reason:
# resolving a name would put a Kubernetes lookup, and a way for it to fail at
# 18:32 with nobody watching, on the path of the one operation that must not be
# fragile. To point at a Service, write its ClusterIP down.
#
# THE PERMISSION IS A SEPARATE GRANT AND THIS CHART DOES NOT CREATE IT. That
# ConfigMap is outside allowedNamespaces - the fence this chart draws is about
# intercepting workloads and has nothing to say about the resolver - so a Role
# granting get and update on it, with resourceNames pinning it to the one
# ConfigMap, is yours to apply deliberately. deploy/rbac.yaml carries it
# commented out, verbatim. Without it nothing crash-loops: the schedule alarms
# and `problem` on GET /schedules names the ConfigMap it may not write.
scheduleDNSConfigMap:
  namespace: ""
  name: ""
  key: host.override

# Changing any of the three settings below rolls the pod: the file is read once
# at startup on purpose, so a change has to restart something to take effect.
#
# The IANA time zone every window is read in unless it names its own with
# `location`. Left empty this is UTC, which is stated rather than guessed: a
# window written in local time and read in UTC is silently an hour wrong for
# half the year, which is the worst way for this to fail.
scheduleDefaultLocation: ""

# How often the schedule controller reconciles. This is BOTH how promptly a
# window opens or closes AND how quickly a scheduled intercept that has died is
# noticed and re-raised.
#
# It is short because of the second of those. A dead global intercept does not
# fail open: it holds every request to the workload, and nobody is awake at
# 03:00 to notice. The service's other safety nets are hours (preview.lifetime)
# or demand-driven, so this interval is the real bound on that exposure. Raising
# it saves one gRPC call per schedule per tick and trades traffic held for it.
scheduleCheckInterval: 30s

service:
  # ClusterIP only, and there is no ingress in this chart on purpose: anything
  # that can reach this service can raise an intercept on any workload in
  # allowedNamespaces and point it at any Service in those same namespaces.
  type: ClusterIP
  port: 80

serviceAccount:
  # The identity presented to the traffic-manager. Its projected token is the
  # only credential the service holds.
  create: true
  # Defaults to the release's full name.
  name: ""
  annotations: {}

# Passed through unchanged.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Long enough for shutdown to remove every intercept and depart the session
# before the container is killed. Removing them is what makes a stop safe: an
# intercept left in manager state with nobody holding its tunnel makes its own
# header hang.
terminationGracePeriodSeconds: 60

nameOverride: ""
fullnameOverride: ""
