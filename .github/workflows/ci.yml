# Every push and every pull request runs the same four checks the repo's own
# `docker run ... golang:1.27-alpine` one-liner runs locally (README, "Building
# and testing"). If the two ever disagree, this file is the one that is wrong.
#
# The `chart` job runs beside them so a broken template is found on the commit
# that broke it, rather than on the tag that tried to publish it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gofmt, build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go-version-file reads the `go` directive out of go.mod, so the toolchain
      # is whatever this repo declares and nothing else. Deliberately not
      # "stable" or "latest": a new Go release must not be able to turn this
      # repo red overnight without a commit that says so.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  chart:
    name: helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          # Pinned for the same reason the Go toolchain is: a new Helm release
          # must not be able to turn this repo red without a commit saying so.
          # Keep it in step with the `chart` job in release.yml.
          version: v3.21.4

      - name: helm lint
        run: helm lint charts/agentic-preview --strict -f charts/example-values.yaml

      - name: helm template
        # Rendering is the check that matters -- lint reports a failed `fail`
        # call as INFO and still passes.
        run: |
          helm template agentic-preview charts/agentic-preview \
            --namespace agentic-preview -f charts/example-values.yaml > /dev/null

      - name: allowedNamespaces is still required
        # The one guarantee the chart makes. If this ever renders, the safety
        # boundary has a silent default and the guard has stopped working.
        run: |
          if helm template agentic-preview charts/agentic-preview >/dev/null 2>&1; then
            echo "The chart rendered without allowedNamespaces. It must not." >&2
            exit 1
          fi
          echo "Refused without allowedNamespaces, as it should."
